<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>609 — Avatar</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8f6fa; }
    #avatar-stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #avatar-stage canvas { display: block; flex: none; width: 100vw !important; height: auto !important; }
    @media (orientation: landscape) {
      #avatar-stage canvas { width: auto !important; height: 100vh !important; height: 100dvh !important; }
    }
    h3, nav { position: fixed; z-index: 1; margin: 0; left: 12px; }
    h3 { top: 12px; font-family: "Comic Sans MS", "Comic Sans", cursive; }
    nav { bottom: 12px; font: 14px Arial, sans-serif; }
    nav a { color: #4d4658; }
  </style>
</head>
<body>
  <h3>609</h3>
  <main id="avatar-stage"><p id="project-status" style="padding:24px;text-align:center;font:16px/1.8 Arial;color:#4d4658">609<br>正在加载 609 avatar…</p></main>
  <div style="position:fixed;left:12px;right:12px;bottom:24px;z-index:10;text-align:center;font:14px/1.5 Arial;color:#4d4658">
    <div id="tracking-status" hidden style="background:#fffe;border-radius:8px;padding:8px"></div>
    <button id="start-tracking" type="button" hidden onclick="startCameraTracking()" style="font:inherit;padding:12px 18px;margin-top:8px;border:1px solid #bbaec6;border-radius:10px;background:#fff">启动人脸追踪</button>
  </div>
  <script src="sketch.js?v=mobile-start-10"></script>
</body>
</html>
